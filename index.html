<body>

<!-- (UNCHANGED HTML UI — keep your existing layout exactly) -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
// ── CONFIG ──
const GOAL = 7;
const DWELL_TIME = 1500;
const DWELL_RADIUS = 0.04;
const SMOOTH_ALPHA = 0.22;
const EMOJIS = ['🎯','⭐','💎','🔮','🚀','🎪','⚡','🌟','🔥','🍀'];
const COLORS = ['#e8162a','#f5c400','#ff6b35','#e8162a','#f5c400'];

// ── STATE ──
let score=0, gameStarted=false, gameOver=false;
let smoothX=0, smoothY=0, lastX=null, lastY=null;
let dwellStart=null, lastHitT=0;
let gameStartTime=null;
let targets=[];

// ── DOM ──
const targetZone = document.getElementById('targetZone');
const scoreNum = document.getElementById('scoreNum');

// ── TARGETS ──
function spawnTarget() {
  const el = document.createElement('div');
  el.className = 'target';
  el.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];

  el.style.left = (12 + Math.random()*74) + '%';
  el.style.top  = (12 + Math.random()*74) + '%';

  targetZone.appendChild(el);
  targets.push(el);
}

function spawnTargets(n=3){
  targetZone.innerHTML='';
  targets=[];
  for(let i=0;i<n;i++) spawnTarget();
}

// ── FIXED HIT FUNCTION ──
function hitTarget(el) {
  if (gameOver) return;

  el.classList.add('popping');
  targets = targets.filter(t => t !== el);

  setTimeout(() => el.remove(), 400);

  score++;
  scoreNum.textContent = score;

  // ⭐ WIN CONDITION FIXED HERE
  if (score >= GOAL && !gameOver) {
    gameOver = true;

    const elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(1);

    setTimeout(() => {
      showWinScreen(elapsed);
    }, 300);

    return;
  }

  setTimeout(() => spawnTarget(), 300);
}

// ── WIN SCREEN ──
function showWinScreen(time){
  alert(`🎉 You won in ${time}s!`);
}

// ── HIT DETECTION ──
function checkHits(x,y){
  const zone = targetZone.getBoundingClientRect();
  const px = x * zone.width;
  const py = y * zone.height;

  for(const t of [...targets]){
    const r = t.getBoundingClientRect();
    const tx = r.left - zone.left + r.width/2;
    const ty = r.top - zone.top + r.height/2;

    const d = Math.hypot(px-tx, py-ty);

    if(d < 40){
      if(Date.now() - lastHitT < 500) return;
      lastHitT = Date.now();
      hitTarget(t);
      return;
    }
  }
}

// ── CAMERA START (simplified placeholder) ──
function startCamera(){
  gameStartTime = Date.now();
  spawnTargets(3);
}
</script>
